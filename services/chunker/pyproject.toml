[project]
name = "chunker"
version = "0.1.0"
description = "trozo chunk service: turns English phrases into reusable Spanish chunks"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.10",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "httpx2>=0.1",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
