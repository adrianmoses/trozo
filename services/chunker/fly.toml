# Chunk service on Fly.io (007). Private: no public IPs, reached by the web
# app over Flycast (http://trozo-chunker.flycast), which starts or resumes the
# machine on demand. Deploy from the repo root so the build context includes
# evals/seed:
#   fly deploy --config services/chunker/fly.toml --no-public-ips --ha=false
app = "trozo-chunker"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  # Flycast is plain HTTP inside the private network.
  force_https = false
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/v1/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

# Response cache (CHUNKER_CACHE_DIR=/app/.cache/chunker). A volume belongs to
# one machine, so the app runs as a single machine.
[[mounts]]
  source = "chunker_cache"
  destination = "/app/.cache"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
