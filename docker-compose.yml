services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: trozo
      POSTGRES_PASSWORD: trozo
      POSTGRES_DB: trozo
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trozo']
      interval: 5s
      timeout: 3s
      retries: 10

  chunker:
    build: ./services/chunker
    ports:
      - '8000:8000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      DATABASE_URL: postgres://trozo:trozo@postgres:5432/trozo
      CHUNKER_URL: http://chunker:8000
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      chunker:
        condition: service_started

volumes:
  pgdata:
