services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: trozo
      POSTGRES_PASSWORD: trozo
      POSTGRES_DB: trozo
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trozo']
      interval: 5s
      timeout: 3s
      retries: 10

  chunker:
    # Repo-root context so the image bakes in the seed, like production (006).
    build:
      context: .
      dockerfile: services/chunker/Dockerfile
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CHUNKER_TOKEN: ${CHUNKER_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHUNKER_VERIFIER_MODEL: ${CHUNKER_VERIFIER_MODEL:-gpt-5.4-mini}
    volumes:
      - chunker-cache:/app/.cache
    ports:
      - '8000:8000'

  # One-shot: applies apps/web/drizzle migrations, then exits. Runs the web
  # runtime image's bundled migrate.mjs, as Fly's release_command does (006).
  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    command: ['node', 'migrate.mjs']
    environment:
      DATABASE_URL: postgres://trozo:trozo@postgres:5432/trozo
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      DATABASE_URL: postgres://trozo:trozo@postgres:5432/trozo
      CHUNKER_URL: http://chunker:8000
      CHUNKER_TOKEN: ${CHUNKER_TOKEN:-}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      chunker:
        condition: service_started

volumes:
  pgdata:
  chunker-cache:
