[project]
name = "evals"
version = "0.1.0"
description = "trozo eval harness: seed set, runner, and reports for the chunk service"
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
