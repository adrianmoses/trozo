# trozo seed set v1 (005; v0 was the 30-item set from 001).
# Format per docs/Chunks Translator — Spec.md, extended in 005: `accepted:`
# (other valid forms of an expected chunk; a string keeps its regions,
# `{surface, regions}` sets its own), `also_valid:` (other valid chunks for
# the phrase: count as correct, not required for recall, not seed matches)
# and `checked:` (native:<region> | reference:<source> | author).
# `split`: dev (prompt tuning, few-shot source) | test (report only). Few-shot
# items in prompts/p1.md are dev by definition.

