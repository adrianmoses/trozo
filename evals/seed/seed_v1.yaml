# trozo seed set v0.
# Format per docs/Chunks Translator — Spec.md. `split`: dev (prompt tuning,
# few-shot source) | test (report only). Few-shot items in prompts/p1.md are
# dev by definition.

- id: miss-you-01
  tier: simple
  split: dev
  input: 'I miss you'
  expected_chunks:
    - surface: echar de menos
      regions: [ES]
    - surface: extrañar
      regions: [neutral]
  forbidden:
    - 'te pierdo'
  expected_note_kinds: []
  source: 'own note / DLE: echar de menos, extrañar'

